server:
  port: ${PORT:8084}

spring:
  application:
    name: estoque
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        auto-startup: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

logging:
  level:
    com.pabloepedro.estoque: INFO
