server:
  port: ${PORT:8081}

spring:
  application:
    name: login

  data:
    mongodb:
      auto-index-creation: true
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/aerospace_hangar}

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app}
