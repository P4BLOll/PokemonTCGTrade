name: Deploy Despacho (Render)

on:
  push:
    branches:
      - main
    paths:
      - 'despacho/**'
      - '.github/workflows/deploy-despacho.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME_AEROSPACE }}
          password: ${{ secrets.TOKEN_AEROSPACE }}

      - name: Build (GraalVM native) e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./despacho
          tags: ${{ secrets.USERNAME_AEROSPACE }}/despacho-spring:latest
          push: true

      - name: Disparar deploy no Render (opcional se Deploy Hook configurado)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_DESPACHO }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_DESPACHO não configurado; imagem enviada ao Docker Hub."
          fi
