name: workflow.yml

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME_AEROSPACE }}
          password: ${{ secrets.TOKEN_AEROSPACE }}

      - name: Build (GraalVM native) e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./despacho
          tags: ${{ secrets.USERNAME_AEROSPACE }}/despacho-spring:latest
          push: true