server:
  port: ${PORT:8082}

spring:
  application:
    name: despacho

  data:
    mongodb:
      auto-index-creation: true
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/aerospace_hangar}

  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        auto-startup: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms

services:
  relatorio:
    url: ${URL_RELATORIO:http://localhost:8085}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

logging:
  level:
    com.pabloepedro.despacho: INFO

event:
  atualizar-missao:
    exchange: atualizar-missao-exchange
    queue: atualizar-missao-queue
